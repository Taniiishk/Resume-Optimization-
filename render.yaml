services:
  - type: web
    name: ats-resume-backend
    runtime: python
    repo: https://github.com/Taniiishk/Resume-Optimization-
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    autoDeploy: true
